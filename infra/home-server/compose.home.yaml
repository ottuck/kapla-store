# Kapla Store 홈서버(M1 + Docker) 배포용 Compose.
# 사용법과 이전 절차는 README.md, 변수는 .env.example 참고.
#   cd ~/server/apps/kapla-store/infra/home-server
#   docker compose -f compose.home.yaml up -d
# 주의: 운영 중에는 `docker compose down -v` 금지(볼륨 = DB와 uploads가 지워진다).
name: kapla-store

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# wordpress와 wpcli가 같은 파일 트리를 봐야 하므로 볼륨 정의를 공유한다.
# 테마와 플러그인은 Git 저장소를 읽기 전용으로 겹쳐 마운트한다(코드는 Git이 원본).
x-wp-volumes: &wp-volumes
  - kapla-wp:/var/www/html
  - ../../themes/kapla:/var/www/html/wp-content/themes/kapla:ro
  - ../../plugins/kapla-shop-tweaks:/var/www/html/wp-content/plugins/kapla-shop-tweaks:ro

services:
  wordpress:
    # 로컬(Local)과 같은 WordPress 7.1.3 / PHP 8.5. arm64 이미지 있음(확인: 2026-10-26).
    image: wordpress:7.1.3-php8.5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 루프백에만 bind. 외부 공개는 Cloudflare Tunnel(→ http://localhost:8081)로만 한다.
      - "127.0.0.1:${KAPLA_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${KAPLA_DB_NAME:-kapla}
      WORDPRESS_DB_USER: ${KAPLA_DB_USER:-kapla}
      WORDPRESS_DB_PASSWORD: ${KAPLA_DB_PASSWORD:?.env에 KAPLA_DB_PASSWORD를 설정하세요}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?.env에 salts를 설정하세요}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?}
      # 공식 이미지의 wp-config가 X-Forwarded-Proto: https 를 보고 HTTPS=on 으로 처리한다(터널 뒤 HTTPS 인식).
      # `$$`는 Compose 보간을 막는 이스케이프다(컨테이너 안에서는 `$`).
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${KAPLA_URL:?.env에 KAPLA_URL을 설정하세요}');
        define('WP_SITEURL', '${KAPLA_URL}');
        define('DISALLOW_FILE_EDIT', true);
        define('DISABLE_WP_CRON', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_MEMORY_LIMIT', '256M');
        if (!empty($$_SERVER['HTTP_CF_CONNECTING_IP'])) {
          $$_SERVER['REMOTE_ADDR'] = $$_SERVER['HTTP_CF_CONNECTING_IP'];
        }
    volumes: *wp-volumes
    configs:
      - source: php-ini
        target: /usr/local/etc/php/conf.d/zz-kapla.ini
      - source: apache-conf
        target: /etc/apache2/conf-enabled/zz-kapla.conf
    mem_limit: ${KAPLA_WP_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    logging: *logging

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${KAPLA_DB_NAME:-kapla}
      MYSQL_USER: ${KAPLA_DB_USER:-kapla}
      MYSQL_PASSWORD: ${KAPLA_DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${KAPLA_DB_ROOT_PASSWORD:?.env에 KAPLA_DB_ROOT_PASSWORD를 설정하세요}
      TZ: Asia/Tokyo
    # 8GB 기기용 절약 설정: performance_schema를 끄고 버퍼 풀을 128MB로 제한한다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
    volumes:
      - kapla-db:/var/lib/mysql
    # 포트를 공개하지 않는다(wordpress / wpcli는 Compose 내부 네트워크에서 db:3306으로 접속).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${KAPLA_DB_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # WP-CLI. 평소에는 뜨지 않고 `docker compose --profile tools run --rm wpcli <명령>` 으로만 실행한다.
  wpcli:
    image: wordpress:cli-2.12-php8.5
    profiles: ["tools"]
    # cli 이미지(alpine)의 www-data uid는 82, wordpress 이미지(debian)는 33이라 맞춰 준다.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${KAPLA_DB_NAME:-kapla}
      WORDPRESS_DB_USER: ${KAPLA_DB_USER:-kapla}
      WORDPRESS_DB_PASSWORD: ${KAPLA_DB_PASSWORD:?}
      WORDPRESS_TABLE_PREFIX: wp_
      # wp-config.php의 CONFIG_EXTRA와 같은 정의를 WP-CLI에도 적용한다.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${KAPLA_URL}');
        define('WP_SITEURL', '${KAPLA_URL}');
        define('DISALLOW_FILE_EDIT', true);
        define('DISABLE_WP_CRON', true);
    volumes: *wp-volumes
    mem_limit: 256m
    logging: *logging

volumes:
  kapla-wp:
  kapla-db:

configs:
  php-ini:
    content: |
      memory_limit = 256M
      upload_max_filesize = 32M
      post_max_size = 32M
      max_execution_time = 60
      expose_php = Off
      date.timezone = Asia/Tokyo
      opcache.memory_consumption = 96
      opcache.interned_strings_buffer = 16
      opcache.max_accelerated_files = 10000
  apache-conf:
    content: |
      ServerTokens Prod
      ServerSignature Off
      # prefork 기본값(150 프로세스)이면 512MB를 금방 넘는다. 동시 처리 수를 줄인다.
      <IfModule mpm_prefork_module>
        StartServers 2
        MinSpareServers 2
        MaxSpareServers 3
        MaxRequestWorkers 6
        MaxConnectionsPerChild 500
      </IfModule>
      # XML-RPC는 쓰지 않으므로 차단한다.
      <Files "xmlrpc.php">
        Require all denied
      </Files>
