# Kapla Store 自宅サーバー(M1 Mac + Docker)用の Compose。
# 使い方と移行手順は docs/PROJECT.md の 4 章、変数は .env.example を参照。
#   cd ~/server/apps/kapla-store/infra/home-server
#   docker compose -f compose.home.yaml up -d
# 注意: 運用中は `docker compose down -v` を使わない(ボリューム = DB と uploads が消える)。
name: kapla-store

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# wordpress と wpcli が同じファイルツリーを見る必要があるため、ボリュームの定義を共有する。
# テーマとプラグインは Git リポジトリを読み取り専用で重ねてマウントする(コードの正は Git)。
x-wp-volumes: &wp-volumes
  - kapla-wp:/var/www/html
  - ../../themes/kapla:/var/www/html/wp-content/themes/kapla:ro
  - ../../plugins/kapla-shop-tweaks:/var/www/html/wp-content/plugins/kapla-shop-tweaks:ro

services:
  wordpress:
    # ローカル(Local)と同じ WordPress 7.1.3 / PHP 8.5。arm64 版あり(確認: 2026-10-26)。
    image: wordpress:7.1.3-php8.5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # ループバックだけに bind。外部への公開は Cloudflare Tunnel(→ http://localhost:8081)だけで行う。
      - "127.0.0.1:${KAPLA_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${KAPLA_DB_NAME:-kapla}
      WORDPRESS_DB_USER: ${KAPLA_DB_USER:-kapla}
      WORDPRESS_DB_PASSWORD: ${KAPLA_DB_PASSWORD:?.env に KAPLA_DB_PASSWORD を設定してください}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?.env に salt を設定してください}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?}
      # 公式イメージの wp-config は X-Forwarded-Proto: https を見て HTTPS=on として扱う(Tunnel の後ろでも HTTPS と認識)。
      # `$$` は Compose の変数展開を防ぐエスケープ(コンテナ内では `$`)。
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${KAPLA_URL:?.env に KAPLA_URL を設定してください}');
        define('WP_SITEURL', '${KAPLA_URL}');
        define('DISALLOW_FILE_EDIT', true);
        define('DISABLE_WP_CRON', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_MEMORY_LIMIT', '256M');
        if (!empty($$_SERVER['HTTP_CF_CONNECTING_IP'])) {
          $$_SERVER['REMOTE_ADDR'] = $$_SERVER['HTTP_CF_CONNECTING_IP'];
        }
    volumes: *wp-volumes
    configs:
      - source: php-ini
        target: /usr/local/etc/php/conf.d/zz-kapla.ini
      - source: apache-conf
        target: /etc/apache2/conf-enabled/zz-kapla.conf
    mem_limit: ${KAPLA_WP_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    logging: *logging

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${KAPLA_DB_NAME:-kapla}
      MYSQL_USER: ${KAPLA_DB_USER:-kapla}
      MYSQL_PASSWORD: ${KAPLA_DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${KAPLA_DB_ROOT_PASSWORD:?.env に KAPLA_DB_ROOT_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    # メモリ 8GB の機器向けの節約設定: performance_schema を無効にし、バッファプールを 128MB に制限する。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
    volumes:
      - kapla-db:/var/lib/mysql
    # ポートは公開しない(wordpress / wpcli は Compose の内部ネットワークから db:3306 に接続)。
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${KAPLA_DB_MEM_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # WP-CLI。普段は起動せず、`docker compose --profile tools run --rm wpcli <コマンド>` でだけ実行する。
  wpcli:
    image: wordpress:cli-2.12-php8.5
    profiles: ["tools"]
    # cli イメージ(alpine)の www-data の uid は 82、wordpress イメージ(debian)は 33 なので合わせる。
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${KAPLA_DB_NAME:-kapla}
      WORDPRESS_DB_USER: ${KAPLA_DB_USER:-kapla}
      WORDPRESS_DB_PASSWORD: ${KAPLA_DB_PASSWORD:?}
      WORDPRESS_TABLE_PREFIX: wp_
      # wp-config.php の CONFIG_EXTRA と同じ定義を WP-CLI にも適用する。
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${KAPLA_URL}');
        define('WP_SITEURL', '${KAPLA_URL}');
        define('DISALLOW_FILE_EDIT', true);
        define('DISABLE_WP_CRON', true);
    volumes: *wp-volumes
    mem_limit: 256m
    logging: *logging

volumes:
  kapla-wp:
  kapla-db:

configs:
  php-ini:
    content: |
      memory_limit = 256M
      upload_max_filesize = 32M
      post_max_size = 32M
      max_execution_time = 60
      expose_php = Off
      date.timezone = Asia/Tokyo
      opcache.memory_consumption = 96
      opcache.interned_strings_buffer = 16
      opcache.max_accelerated_files = 10000
  apache-conf:
    content: |
      ServerTokens Prod
      ServerSignature Off
      # prefork の初期値(150 プロセス)ではすぐに 512MB を超えるため、同時処理数を減らす。
      <IfModule mpm_prefork_module>
        StartServers 2
        MinSpareServers 2
        MaxSpareServers 3
        MaxRequestWorkers 6
        MaxConnectionsPerChild 500
      </IfModule>
      # XML-RPC は使わないためブロックする。
      <Files "xmlrpc.php">
        Require all denied
      </Files>
